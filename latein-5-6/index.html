:root{--ink:#24363a;--teal:#735526;--violet:#315f68;--paper:#fbfaf6;--line:#d8e0dd}*{box-sizing:border-box}body{margin:0;background:#eaf0ed;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.6}main{max-width:940px;margin:auto;padding:28px 24px 65px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:25px}.brand{font-weight:750;letter-spacing:.02em}a{color:var(--teal)}button,input{font:inherit}button{cursor:pointer;border:1px solid transparent;background:var(--teal);color:white;border-radius:12px;padding:12px 20px;font-weight:650;min-height:48px}button.secondary{background:white;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ba7b0b;outline-offset:3px}input{width:100%;background:white;border:2px solid #94aaa6;border-radius:12px;padding:14px;color:var(--ink)}h1{font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:-.035em;margin:0 0 14px}h2{font-size:25px;line-height:1.35}h3{font-size:19px}.muted{color:#586c6e}.small{font-size:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .card{margin:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tag{color:var(--violet)}.topic{font-size:14px;text-transform:uppercase;letter-spacing:.09em;font-weight:750;color:var(--teal)}.sentence{font-size:clamp(23px,3.5vw,30px);line-height:1.6;margin:28px 0;overflow-wrap:anywhere}.rule{background:#edf4f1;border-left:4px solid var(--teal);padding:18px;border-radius:8px;margin:18px 0}.rule.tags{background:#f0ecf7;border-color:var(--violet)}.choice{display:block;width:100%;margin:10px 0;text-align:left;background:white;color:var(--ink);border:1px solid #a9b8b4}.feedback{background:#ecf4ed;border-left:4px solid #317348;padding:18px;margin:20px 0;bo [5,'sonus',['der Ton','der Klang','das Geräusch'],'Eine SONate besteht aus Tönen. Stell dir einen einzigen lauten Ton vor.','Wortfamilie'],

const FORMS=[];
function form(group,prompt,answer,why,extra={}){FORMS.push({id:'f'+FORMS.length,group,prompt,answers:answer.split('|'),why,...extra})}
const nouns=[['servus','serv','o','der Sklave','die Sklaven'],['dominus','domin','o','der Herr','die Herren'],['amicus','amic','o','der Freund','die Freunde'],['puella','puell','a','das Mädchen','die Mädchen'],['serva','serv','a','die Sklavin','die Sklavinnen'],['aqua','aqu','a','das Wasser',''],['cōpia','cōpi','a','der Vorrat','die Vorräte'],['ventus','vent','o','der Wind','die Winde'],['populus','popul','o','das Volk','die Völker'],['Aeolus','Aeol','o','Äolus',''],['gladius','gladi','ius','das Schwert','die Schwerter'],['fluvius','fluvi','ius','der Fluss','die Flüsse']];

for(const [nom,stem,type,meaning,plural] of nouns.filter(n=>['servus','dominus','amicus','puella','serva','Aeolus'].includes(n[0]))){let a=type==='a';form('vokativ',`Sprich eine Person direkt an: ${nom} → Vokativ Singular.`,a?nom:stem+'e',a?'Bei der a-Deklination bleibt die Einzahl auf -a.':'Anrede: -us wird im Singular zu -e.',{stem,ending:a?'a':'e'});if(plural)form('vokativ',`Sprich mehrere direkt an: ${nom} → Vokativ Plural.`,stem+(a?'ae':'ī'),`Vokativ Plural wie Nominativ Plural: ${a?'-ae':'-ī'}.`,{stem,ending:a?'ae':'ī'})}

const verbs=WORDS.filter(w=>w.latin.includes(',')).map(w=>{let [inf,first]=w.latin.split(', ');return {inf,first,stem:inf.slice(0,-2)}});const persons=['ich','du','er/sie/es','wir','ihr','sie (Mehrzahl)'],ends=['ō','s','t','mus','tis','nt'];for(const v of verbs){for(let p=0;p<6;p++)form('verb',`${v.inf}: ${persons[p]} → lateinische Präsensform`,(p===0?v.first:(p===2||p===5?v.stem.replace(/ē$/,'e'):v.stem)+ends[p]),`e-Konj.: Stamm ${v.stem}- + ${ends[p]}. Reihenfolge: -ō, -s, -t, -mus, -tis, -nt.`,{stem:p===0?v.first.slice(0,-1):(p===2||p===5?v.stem.replace(/ē$/,'e'):v.stem),ending:ends[p]});form('imperativ',`${v.inf}: Aufforderung an eine Person.`,v.stem,`Imperativ Singular: ${v.inf} ohne -re.`);form('imperativ',`${v.inf}: Aufforderung an mehrere Personen.`,v.stem+'te',`Imperativ Plural: ${v.stem} + te.`)}
['sum','es','est','sumus','estis','sunt'].forEach((a,i)=>form('verb',`esse: ${persons[i]} → lateinische Präsensform`,a,'esse: sum, es, est, sumus, estis, sunt.'));form('imperativ','esse: „Sei!“','es','Imperativ Singular von esse: es.');form('imperativ','esse: „Seid!“','este','Imperativ Plural von esse: este.');
form('dativ','Übersetze nur dominō: Servus dominō respondet.','dem Herrn','dominō: Dativ Singular; wem antwortet er?');form('dativ','Übersetze nur puellīs: Amicus puellīs respondet.','den Mädchen','-īs: Dativ Plural.');form('dativ','Welche Frage passt zum Dativ?','wem','Nach dem Dativ fragt man „wem?“.');form('vokativ','Welcher Fall ist die direkte Anrede?','Vokativ','Vokativ: jemanden ansprechen.');form('unterscheiden','Servī dominō pārent. Welche Form hat servī hier?','Nominativ Plural|Nom Pl','Servī ist das Subjekt: die Sklaven. dominō = dem Herrn, Dativ Singular.');form('unterscheiden','Antonia puellae respondet. Welche Form hat puellae hier?','Dativ Singular|Dat Sg','Wem antwortet Antonia? Einem Mädchen. respondet braucht hier ein Dativobjekt.');form('unterscheiden','Puellae rīdent. Welche Form hat puellae hier?','Nominativ Plural|Nom Pl','Wer lacht? Die Mädchen: Nominativ Plural.');form('unterscheiden','Respondēte, puellae! Welche Form hat puellae hier?','Vokativ Plural|Vok Pl','Die Mädchen werden direkt angesprochen: Vokativ Plural.');form('unterscheiden','In „Servus dominō tabulam praebet“: Übersetze nur tabulam.','die Tafel|die Schreibtafel','tabulam ist Akkusativ Singular: was gibt er? dominō ist Dativ: wem?');
const RULES={dativ:['Dativ: Wem?','a-Deklination: puella → puellae; Plural puellīs. o-Deklination: servus → servō; Plural servīs. Merksatz: „Einer: ae oder ō. Mehreren: īs.“','Servus dominō tabulam praebet. Der Sklave gibt dem Herrn die Tafel. WEM? dominō. WAS? tabulam.'],vokativ:['Vokativ: direkte Anrede','Einzahl: puella bleibt puella; servus wird serve. Mehrzahl: puellae und servī, wie der Nominativ. Bei -ius: Gaius → Gāī. Merksatz: „Rufst du einen auf -us, wird daraus -e.“','Respondē, serve! Antworte, Sklave! / Respondēte, servī! Antwortet, Sklaven! Anrede ist kein Dativ.'],imperativ:['Imperativ: eine oder mehrere Personen','e-Konj.: Infinitiv ohne -re für eine Person; plus -te für mehrere. habēre → habē! / habēte! esse: es! / este!','Merksatz: „Einer hört das -ē; mehrere bekommen -te.“ Verb und angeredete Personen müssen zusammenpassen.'],verb:['Präsens: Person erkennen','ich -ō · du -s · er/sie/es -t · wir -mus · ihr -tis · sie -nt. habēre: habeō, habēs, habet, habēmus, habētis, habent. esse: sum, es, est, sumus, estis, sunt.','Stamm und Endung getrennt merken. Sprich die sechs Formen einmal im Rhythmus und rufe sie dann ohne Vorlage ab.'],unterscheiden:['Gleiche Endung, andere Aufgabe','puellae kann Nominativ Plural, Dativ Singular oder Vokativ Plural sein. Frag nach der Satzrolle: Wer? Wem? Oder direkte Anrede?','Puellae rīdent: Wer? / Puellae respondet: Wem? / Respondēte, puellae!: direkte Anrede.']};
let state;try{state=JSON.parse(localStorage.getItem('latin56-v1'))||{profiles:[],active:null}}catch{state={profiles:[],active:null}}let session=null,answered=false,helped=false;
function p(){return state.profiles.find(x=>x.id===state.active)}function save(){try{localStorage.setItem('latin56-v1',JSON.stringify(state))}catch{$('#app').insertAdjacentHTML('beforeend','<p>Speichern ist in diesem Browser gerade nicht möglich. Du kannst trotzdem weiterlernen.</p>')}}
function normal(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[!?.,;:()]/g,' ').replace(/\s+/g,' ').trim()}
function german(s){return normal(s).replace(/^(der|die|das|dem|den|ein|eine|einem|einer) /,'')}
function isCorrect(q,value){if(!value.trim())return false;let f=q.type==='vocab'&&q.dir==='de'?german:normal;return q.answers.some(a=>f(a)===f(value))}
function stat(id){return p().stats[id]||{ok:0,errors:0,due:0,last:0}}function mastered(id){return stat(id).ok>=2}function mix(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function profiles(){session=null;$('#app').innerHTML='<section class="card guide"><div class="topic">Dein Lernplatz</div><h1>Wie möchtest du heißen?</h1><form id="new"><label for="name">Vorname oder Spitzname</label><input id="name" maxlength="30" required autocomplete="off"><p><button>Profil anlegen</button></p></form><div class="row" id="names"></div><p class="small muted">Jedes Profil hat einen eigenen Lernstand. Auf einem anderen Gerät beginnst du neu.</p></section>';state.profiles.forEach(x=>{let b=document.createElement('button');b.textContent=x.name;b.className='secondary';b.onclick=()=>{state.active=x.id;save();home()};$('#names').append(b)});$('#new').onsubmit=e=>{e.preventDefault();let name=$('#name').value.trim();if(!name)return;let id=Date.now()+'-'+Math.random().toString(36).slice(2);state.profiles.push({id,name,stats:{},notes:{},seen:[],history:[]});state.active=id;save();home()}}
function home(){session=null;if(!p())return profiles();let learned=WORDS.filter(w=>mastered(w.id)).length,open=WORDS.filter(w=>stat(w.id).errors&& !mastered(w.id)).length,seen=p().seen.length;$('#app').innerHTML=`<div class="topic">Campus C / Kapitel 5 & 6</div><h1>Hallo, ${esc(p().name)}.</h1><p class="muted">30 Wörter und Wendungen. Erst merken, dann ohne Hilfe abrufen.</p><section class="card"><h2>Deine nächste kleine Portion</h2><p>Sechs Lernwörter mit einer Merkhilfe. Danach Auswahl und eigener Abruf. Bereits geübte Fehlerstellen kommen bevorzugt dran.</p><button id="learn">${seen===30?'Schwierige Wörter festigen':'Sechs Wörter lernen'}</button>${p().pending?'<button class="secondary" id="resume">Runde fortsetzen</button>':''}<div class="meter" style="margin-top:24px"><div><b>${seen}/30</b><br><span class="small">angesehen</span></div><div><b>${learned}/30</b><br><span class="small">zweimal abgerufen</span></div><div><b>${open}</b><br><span class="small">offene Fehlerstellen</span></div></div></section><div class="grid"><section class="card"><div class="topic">Wortschatz / Hauptteil</div><h2>Wörter selbst abrufen</h2><div class="bar"><button data-vocab="5">Kapitel 5</button><button data-vocab="6">Kapitel 6</button><button class="secondary" id="vocab">5 & 6 gemischt</button></div><p class="small muted">Jede Runde umfasst alle 15 bzw. 30 Wörter. Eine passende Bedeutung reicht; alle Buchbedeutungen werden danach angezeigt.</p><label for="direction">Abfragerichtung</label><select id="direction" style="font:inherit;padding:10px;max-width:100%"><option value="de">Latein → Deutsch</option><option value="la">Deutsch → Latein</option></select></section><section class="card"><div class="topic tag">Formen / kurz und gezielt</div><h2>Anreden und zuordnen</h2><div class="bar"><button data-form="dativ">Dativ</button><button data-form="vokativ">Vokativ</button><button class="secondary" data-form="imperativ">Imperativ</button><button class="secondary" data-form="verb">Verbformen</button><button class="secondary" data-form="unterscheiden">Formen unterscheiden</button></div><p class="small muted">Die Hauptthemen sind Dativ und Vokativ. Imperativ und Präsens sind als Zusatzteil aus den Fotos verfügbar.</p></section></div><section class="card"><h2>Festigen und Probe machen</h2><div class="bar"><button id="due">Fällige Wörter wiederholen</button><button class="secondary" id="mistakes">Fehlerstellen</button><button class="secondary" id="exam">Probe für morgen</button><button class="secondary" id="morning">Morgen früh: kurzer Abruf</button></div><p class="small muted">Die Probe enthält 12 Wörter und 4 Formen; Lösungen erst am Ende. Kein Zeitlimit.</p></section><details class="card"><summary>Dein Lernplan für heute</summary><p>Vier bis fünf kurze Portionen über den Tag verteilen, mit Pausen. Nach einer Pause selbst abrufen; später die Fehlerstellen wiederholen. Abends eine Probe, morgen früh ein kurzer Abruf.</p><p>Die App schlägt nach gelungenem Abruf Wiederholungen nach etwa 10 Minuten, 45 Minuten und später am Tag vor. Das sind praktische Richtwerte für diesen einen Lerntag.</p><p>„Zweimal abgerufen“ zählt nur Antworten ohne Tipp oder Auswahl. Es zeigt Übungsfortschritt, keine garantierte Prüfungsleistung.</p>${p().history.slice(-4).reverse().map(h=>`<p>${esc(h.title)}: ${h.ok}/${h.total} ohne Hilfe richtig.</p>`).join('')}</details><details class="card"><summary>Alle Lernwörter und Merkhilfen</summary><p>Klangbrücken sind Eselsbrücken, keine Wortherleitungen. Du kannst jede Merkhilfe durch deine eigene ersetzen.</p><table class="wordlist"><thead><tr><th>Latein</th><th>Deutsch</th></tr></thead><tbody>${WORDS.map(w=>`<tr><td>${esc(w.latin)}<br><span class="small muted">Kapitel ${w.chapter}</span></td><td>${esc(w.answers.join('; '))}<br><span class="small muted">${esc(p().notes[w.id]||w.anchor)}</span></td></tr>`).join('')}</tbody></table></details>`;$('#learn').onclick=startLearn;document.querySelectorAll('[data-vocab]').forEach(b=>b.onclick=()=>startVocab(+b.dataset.vocab));$('#vocab').onclick=()=>startVocab(0);document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>rule(b.dataset.form));$('#due').onclick=startDue;$('#mistakes').onclick=startMistakes;$('#exam').onclick=startExam;$('#morning').onclick=()=>startMorning();if($('#resume'))$('#resume').onclick=()=>{session=p().pending;if(session.results.length>session.index)session.index++;question()}}
function vocabQ(w,dir='de',mode='write'){return {id:w.id,type:'vocab',dir,mode,word:w,prompt:dir==='de'?w.latin:w.answers.join('; '),answers:dir==='de'?w.answers:[w.latin.split(',')[0]],why:w.anchor}}
function formQ(q){return {...q,type:'form',mode:'write'}}
function begin(title,qs,test=false){session={title,qs,index:0,results:[],retries:[],test};question()}
function startVocab(ch){let dir=$('#direction').value;begin(ch?'Wortschatz '+ch:'Wortschatz 5 & 6',mix(WORDS.filter(w=>!ch||w.chapter===ch)).map(w=>vocabQ(w,dir)))}
function priority(words){return mix(words).sort((a,b)=>(mastered(a.id)-mastered(b.id))||stat(b.id).errors-stat(a.id).errors||stat(a.id).last-stat(b.id).last)}
function startLearn(){let words=priority(WORDS.filter(w=>!p().seen.includes(w.id))).slice(0,6);if(!words.length)words=priority(WORDS).slice(0,6);let qs=[];words.forEach(w=>qs.push(vocabQ(w,'de','study')));words.forEach(w=>qs.push(vocabQ(w,'de','choice')));mix(words).forEach(w=>qs.push(vocabQ(w)));mix(words).forEach(w=>qs.push(vocabQ(w)));begin('Sechs Wörter festigen',qs)}
function startDue(){let words=WORDS.filter(w=>stat(w.id).last&&stat(w.id).due<=Date.now());if(!words.length){let times=WORDS.filter(w=>stat(w.id).due>Date.now()).map(w=>stat(w.id).due);$('#app').innerHTML=`<section class="card"><h1>Noch keine Wiederholung fällig.</h1><p>${times.length?'Die nächste ist in etwa '+Math.max(1,Math.ceil((Math.min(...times)-Date.now())/60000))+' Minuten fällig.':'Lerne zuerst eine kleine Portion.'}</p><button id="back">Zur Übersicht</button><button class="secondary" id="now">Jetzt selbst abrufen</button></section>`;$('#back').onclick=home;$('#now').onclick=()=>begin('Jetzt wiederholen',priority(WORDS).slice(0,10).map(w=>vocabQ(w)));return}begin('Fällige Wiederholung',priority(words).slice(0,15).map(w=>vocabQ(w)))}
function startMistakes(){let qs=[...WORDS.filter(w=>stat(w.id).errors&&!mastered(w.id)).map(w=>vocabQ(w)),...FORMS.filter(q=>stat(q.id).errors&&!mastered(q.id)).map(formQ)];if(!qs.length){$('#app').innerHTML='<section class="card"><h1>Keine offenen Fehlerstellen.</h1><p>Prüfe dich mit neuen Formen und dem gemischten Wortschatz.</p><button id="back">Zur Übersicht</button></section>';$('#back').onclick=home;return}begin('Fehlerstellen',mix(qs).slice(0,15))}
function startMorning(){begin('Kurzer Abruf', [...priority(WORDS).slice(0,8).map(w=>vocabQ(w)),...mix(FORMS.filter(q=>['dativ','vokativ'].includes(q.group))).slice(0,4).map(formQ)])}
function startExam(){begin('Probe für morgen',[...mix(WORDS.filter(w=>w.chapter===5)).slice(0,6),...mix(WORDS.filter(w=>w.chapter===6)).slice(0,6)].map(w=>vocabQ(w)).concat(mix(FORMS.filter(q=>q.group==='dativ')).slice(0,2).map(formQ),mix(FORMS.filter(q=>q.group==='vokativ')).slice(0,2).map(formQ)),true)}
function rule(group){let rs=RULES[group];$('#app').innerHTML=`<button class="secondary" id="back">Übersicht</button><section class="card guide"><div class="topic tag">Formen verstehen</div><h1>${rs[0]}</h1><div class="rule tags">${rs[1]}</div><p>${rs[2]}</p><button id="practice">Zehn Formen üben</button></section>`;$('#back').onclick=home;$('#practice').onclick=()=>begin(rs[0],mix(FORMS.filter(q=>q.group===group)).slice(0,10).map(formQ))}
function question(){if(session.index>=session.qs.length)return finish();p().pending=session;save();answered=false;helped=false;let q=session.qs[session.index],study=q.mode==='study';$('#app').innerHTML=`<div class="toolbar"><button class="secondary" id="pause">Pause / Übersicht</button><span>${esc(session.title)} · ${session.index+1}/${session.qs.length}</span></div><progress max="${session.qs.length}" value="${session.index}" aria-label="Fortschritt"></progress><section class="card guide"><div class="topic ${q.type==='form'?'tag':''}">${q.type==='vocab'?'Wortschatz '+q.word.chapter:esc(RULES[q.group][0])}${study?' · merken':q.mode==='choice'?' · auswählen':' · selbst abrufen'}</div><h2>${q.type==='vocab'?(q.dir==='de'?'Was bedeutet das?':'Wie heißt das auf Latein?'):'Bilde oder bestimme die Form.'}</h2><p class="${q.type==='vocab'?'latin':'sentence'}">${esc(q.prompt)}</p><div id="work"></div><div id="feedback" aria-live="polite"></div></section>`;$('#pause').onclick=()=>{save();$('#app').innerHTML='<section class="card"><h1>Kurze Pause.</h1><p>Deine Runde ist gespeichert.</p><button id="resume">Fortsetzen</button> <button class="secondary" id="leave">Zur Übersicht</button></section>';$('#resume').onclick=question;$('#leave').onclick=home};if(study){$('#work').innerHTML=`<p><strong>${esc(q.answers.join('; '))}</strong></p><div class="anchor"><span class="small">${esc(q.word.kind)}</span><p>${esc(p().notes[q.id]||q.word.anchor)}</p></div><p class="small muted">Stell dir die Szene kurz vor. Sage das lateinische Wort und seine Bedeutung laut.</p><details><summary>Meine eigene Merkhilfe</summary><label for="note">Dein Bild oder Satz</label><input id="note" maxlength="240" value="${esc(p().notes[q.id]||'')}"><button class="secondary" id="saveNote">Merkhilfe speichern</button></details><p><button id="nextStudy">Gemerkt – weiter</button></p>`;$('#saveNote').onclick=()=>{p().notes[q.id]=$('#note').value.trim();save();$('#saveNote').textContent='Gespeichert'};$('#nextStudy').onclick=()=>{if(!p().seen.includes(q.id))p().seen.push(q.id);session.results.push({q,value:'angesehen',ok:true,independent:false,study:true});session.index++;question()};return}
if(q.mode==='choice'){let options=[q.answers.join('; '),...mix(WORDS.filter(w=>w.id!==q.id)).slice(0,3).map(w=>w.answers.join('; '))];$('#work').innerHTML='<div id="choices"></div>';mix(options).forEach((label)=>{let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>submit(label,label===q.answers.join('; '));$('#choices').append(b)})}else{$('#work').innerHTML=`<form id="answerform"><label for="answer">${q.type==='vocab'&&q.dir==='de'?'Eine passende Bedeutung genügt.':'Deine Antwort'}</label><input id="answer" autocomplete="off" spellcheck="false" autocapitalize="off"><p><button>${session.test?'Antwort abgeben':'Prüfen'}</button></p></form>${!session.test?'<button class="secondary" id="hint">Merkhilfe anzeigen</button> <button class="secondary" id="unknown">Weiß ich noch nicht</button>':''}<p class="small muted">Längenzeichen und Großschreibung werden nicht bewertet. Bei Deutsch → Latein gibst du bei Verben den Infinitiv ein.</p>`;$('#answerform').onsubmit=e=>{e.preventDefault();submit($('#answer').value)};if(!session.test){$('#hint').onclick=()=>{helped=true;$('#hint').disabled=true;$('#feedback').innerHTML='<div class="anchor">'+esc(q.type==='vocab'?(p().notes[q.id]||q.word.anchor):q.why)+'</div>'};$('#unknown').onclick=()=>submit('weiß ich noch nicht',false)}}}
function submit(value,forced){if(answered||!value.trim())return;answered=true;let q=session.qs[session.index],ok=forced===undefined?isCorrect(q,value):forced,independent=ok&&!helped&&q.mode!=='choice';session.results.push({q,value,ok,independent});let st=stat(q.id);if(independent){st.ok++;st.due=Date.now()+[10,45,180][Math.min(st.ok-1,2)]*60000}else if(!ok){st.ok=0;st.errors++;st.due=Date.now()+2*60000;if(!session.test&&!session.retries.includes(q.id)&&session.retries.length<8){session.retries.push(q.id);let repeat={...q,mode:'write'};session.qs.splice(Math.min(session.index+5,session.qs.length),0,repeat)}}st.last=Date.now();p().stats[q.id]=st;save();if(session.test){session.index++;question();return}document.querySelectorAll('#work button,#work input').forEach(e=>e.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${ok?'':'error'}"><strong>${ok?(independent?'Richtig – selbst abgerufen.':'Richtig – mit Unterstützung.'):'Noch nicht sicher.'}</strong>${!ok?`<p>Deine Antwort: ${esc(value)}</p>`:''}<p>Richtig: <b>${q.type==='form'&&q.stem?`${esc(q.stem)}<span class="ending">${esc(q.ending)}</span>`:esc(q.answers.join('; '))}</b></p><p>${esc(q.type==='vocab'?(p().notes[q.id]||q.word.anchor):q.why)}</p>${!ok?'<p class="small">Die Aufgabe kommt nach anderen Aufgaben erneut. Schau dir die Lösung an und rufe sie dann ohne Hilfe ab.</p>':''}</div><button id="next">Weiter</button>`;$('#next').onclick=()=>{session.index++;question()}}
function finish(){let results=session.results.filter(r=>!r.study),ok=results.filter(r=>r.independent).length;delete p().pending;p().history.push({title:session.title,ok,total:results.length,time:Date.now()});save();let errors=results.filter(r=>!r.ok);$('#app').innerHTML=`<section class="card"><div class="topic">Runde abgeschlossen</div><h1>${ok}/${results.length} ohne Hilfe richtig</h1><p>${errors.length?'Wiederhole diese Fehler nach einer kurzen Pause.':'Mach eine Pause und rufe die Wörter später noch einmal ab.'}</p><button id="back">Zur Übersicht</button>${errors.length?' <button class="secondary" id="retry">Diese Fehler wiederholen</button>':''}</section><section class="card"><h2>Deine Antworten</h2>${results.map(r=>`<div class="result"><b>${r.ok?'Richtig':'Noch üben'}</b> · ${esc(r.q.prompt)}<p>Deine Antwort: ${esc(r.value)}</p><p>Lösung: ${esc(r.q.answers.join('; '))}</p><p class="small muted">${esc(r.q.type==='vocab'?(p().notes[r.q.id]||r.q.word.anchor):r.q.why)}</p></div>`).join('')}</section>`;$('#back').onclick=home;if($('#retry'))$('#retry').onclick=()=>begin('Gezielte Wiederholung',[...new Map(errors.map(r=>[r.q.id,{...r.q,mode:'write'}])).values()])}
$('#profile').onclick=profiles;$('#share').onclick=async()=>{let url=new URL(location.href);url.search='';url.hash='';try{if(navigator.share)await navigator.share({title:'Latein Wortschatz 5 & 6',url:url.href});else{await navigator.clipboard.writeText(url.href);$('#share').textContent='Link kopiert'}}catch(e){if(e.name!=='AbortError'){$('#app').insertAdjacentHTML('afterbegin',`<div class="card">Kopiere diesen Link: <input readonly value="${esc(url.href)}"></div>`)}}};home();
</script></body></html>
