<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13686c"><title>Englisch · Grammatikwerkstatt</title><style>
:root{--ink:#24363a;--teal:#13686c;--violet:#624396;--paper:#fbfaf6;--line:#d8e0dd}*{box-sizing:border-box}body{margin:0;background:#eaf0ed;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.6}main{max-width:940px;margin:auto;padding:28px 24px 65px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:25px}.brand{font-weight:750;letter-spacing:.02em}a{color:var(--teal)}button,input{font:inherit}button{cursor:pointer;border:1px solid transparent;background:var(--teal);color:white;border-radius:12px;padding:12px 20px;font-weight:650;min-height:48px}button.secondary{background:white;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ba7b0b;outline-offset:3px}input{width:100%;background:white;border:2px solid #94aaa6;border-radius:12px;padding:14px;color:var(--ink)}h1{font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:-.035em;margin:0 0 14px}h2{font-size:25px;line-height:1.35}h3{font-size:19px}.muted{color:#586c6e}.small{font-size:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .card{margin:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tag{color:var(--violet)}.topic{font-size:14px;text-transform:uppercase;letter-spacing:.09em;font-weight:750;color:var(--teal)}.sentence{font-size:clamp(23px,3.5vw,30px);line-height:1.6;margin:28px 0;overflow-wrap:anywhere}.rule{background:#edf4f1;border-left:4px solid var(--teal);padding:18px;border-radius:8px;margin:18px 0}.rule.tags{background:#f0ecf7;border-color:var(--violet)}.choice{display:block;width:100%;margin:10px 0;text-align:left;background:white;color:var(--ink);border:1px solid #a9b8b4}.feedback{background:#ecf4ed;border-left:4px solid #317348;padding:18px;margin:20px 0;border-radius:8px}.feedback.error{background:#fff1e9;border-color:#a84d20}progress{width:100%;height:9px;accent-color:var(--teal)}.status{display:inline-block;font-size:14px;background:#e8eeeb;padding:4px 12px;border-radius:20px}.num{font-size:30px;font-weight:750}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.result{border-top:1px solid var(--line);padding:15px 0}.tokens button{margin:5px;font-size:18px}.answerzone{min-height:70px;background:#eef2ef;border-radius:10px;padding:8px;margin:15px 0}.answerzone button{background:#fff;color:var(--ink);border:1px solid #94aaa6;margin:4px}footer{margin-top:35px;font-size:14px;color:#586c6e}ul{padding-left:22px}li{margin:8px 0} @media(max-width:620px){main{padding:20px 15px 45px}.grid{grid-template-columns:1fr}.card{padding:21px}.toolbar{align-items:flex-start}header{margin-bottom:20px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}} </style></head><body><main><header><div class="brand">ENGLISCH / Grammatikwerkstatt</div><div class="row"><a href="../">Latein</a><button class="secondary" id="profile">Profil wechseln</button><button class="secondary" id="share">Teilen</button></div></header><div id="app"></div><footer>Going-to future & question tags · Eigene Übungen zu den fotografierten Green-Line-2-Seiten (Bayern).<br>Keine Anmeldung. Namen und Lernstände bleiben in diesem Browser. Ein geteilter Link enthält keine Profile.</footer></main><script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB=[];
function add(topic,skill,prompt,answer,why,options){DB.push({id:DB.length,topic,skill,prompt,answer,why,options})}
const future=[
['be','I ___ going to visit my friend tomorrow.','am','I gehört zu am.'],
['be','Emily ___ going to ride her horse.','is','Emily ist eine Person: she → is.'],
['be','Jack and Ryan ___ going to watch a film.','are','Zwei Personen: they → are.'],
['negative','She ___ going to swim. (Verneinung: is not)','is not|isn\'t','not steht direkt hinter is.'],
['negative','We ___ going to stay at home. (Verneinung: are not)','are not|aren\'t','We → are; verneint: are not / aren’t.'],
['negative','I ___ going to play tennis. (Verneinung)','am not|\'m not','I am not going to …; kein amn’t verwenden.'],
['question','___ you going to visit the farm?','Are','Bei einer Frage steht Are vor you.'],
['question','___ she going to meet her friends?','Is','Bei she steht Is vor der Person.'],
['question','Where ___ they going to go?','are','Nach dem Fragewort folgt are, dann they.'],
['question','How long ___ going to stay? (sie = she)','is she','How long + is + she + going to + stay?'],
['base','He is going to ___ football. (play)','play','Nach going to steht die Grundform, ohne -s.'],
['base','We are going to ___ a barbecue. (have)','have','Nach going to bleibt have in der Grundform.'],
['short','Is Emily going to come? — Yes, ___.','she is','Kurzantwort: Yes, she is. Hier nicht she’s.'],
['short','Are they going to swim? — No, ___.','they aren\'t|they are not','Kurzantwort mit are: No, they aren’t.'],
['short','Are you going to stay? — Yes, ___. (Antwort mit I)','I am','Die Frage spricht dich an: Antwort mit I am.'],
['short','Is Jack going to ride? — No, ___.','he isn\'t|he is not','Jack → he; negative Kurzantwort mit isn’t.'],
['sentence','Bilde eine Aussage: she / visit the farm / tomorrow','She is going to visit the farm tomorrow.','She + is + going to + visit + Ergänzung.'],
['sentence','Bilde eine Verneinung: they / watch a film / tonight','They are not going to watch a film tonight.|They aren\'t going to watch a film tonight.','They + are not + going to + Grundform.'],
['question','Bilde eine Frage: you / play football / tomorrow','Are you going to play football tomorrow?','Are + you + going to + play …?'],
['question','Bilde eine Frage: where / he / stay','Where is he going to stay?','Where + is + he + going to + stay?'],
['use','Ein fester Plan: „Wir werden am Samstag unsere Freunde treffen.“','We are going to meet our friends on Saturday.|We\'re going to meet our friends on Saturday.','Ein Plan: be + going to + meet.'],
['use','Dunkle Wolken sind zu sehen. Ergänze: It ___ rain.','is going to|\'s going to','Sichtbare Anzeichen für die Zukunft: is going to rain.'],
['repair','Verbessere: She going to visit London.','She is going to visit London.|She\'s going to visit London.','Die Form von be fehlt: is.'],
['repair','Verbessere: Is going to he play tennis?','Is he going to play tennis?','In der Frage steht he direkt nach Is.'],
['repair','Verbessere: He is going to plays football.','He is going to play football.','Grundform play, kein -s.'],
['negative','They are going to visit London. Schreibe den Satz verneint.','They are not going to visit London.|They aren\'t going to visit London.','not steht nach are.'],
['question','___ going to meet us? (Jack: Entscheidungsfrage)','Is Jack','Is + Jack + going to …?'],
['be','My parents ___ going to work tomorrow.','are','My parents → they → are.'],
['use','Wähle die Bedeutung: „I am going to visit my aunt tomorrow.“','Ein Plan für morgen','Going to beschreibt hier einen bereits bestehenden Plan.',['Eine Gewohnheit','Ein Plan für morgen','Eine abgeschlossene Handlung']],
['use','Wähle die Bildung des going-to future.','am/is/are + going to + Grundform','Die Form von be gehört unbedingt dazu.',['going to + Verb mit -s','am/is/are + going to + Grundform','do/does + going to']]
];future.forEach(x=>add('future',...x));
const tags=[
['be','Emily is happy, ___?','isn\'t she','is → isn’t; Emily → she.'],
['be','The boys are nervous, ___?','aren\'t they','are → aren’t; the boys → they.'],
['be','Jack isn’t tired, ___?','is he','Negativer Satz → positiver tag; Jack → he.'],
['be','You aren’t disappointed, ___?','are you','aren’t → are; Person bleibt you.'],
['past','Emily was nervous, ___?','wasn\'t she','Vergangenheit mit was → wasn’t.'],
['past','The friends weren’t late, ___?','were they','weren’t → were; the friends → they.'],
['present','She likes horses, ___?','doesn\'t she','Simple Present: she + Vollverb → doesn’t she.'],
['present','You play football, ___?','don\'t you','Simple Present mit you → don’t you.'],
['present','Emily and Jack practise a lot, ___?','don\'t they','Vollverb im Simple Present; mehrere Personen → don’t they.'],
['present','He doesn’t live here, ___?','does he','doesn’t → does; Person he.'],
['present','We don’t know the answer, ___?','do we','Negatives don’t → positives do.'],
['past','Ryan watched a film, ___?','didn\'t he','Simple Past mit Vollverb → didn’t; Ryan → he.'],
['past','Emily’s hat didn’t fall off, ___?','did it','didn’t → did; der Hut wird zu it.'],
['past','They visited the farm, ___?','didn\'t they','visited: Simple Past → didn’t.'],
['past','You didn’t meet Jack, ___?','did you','Negativer Satz → positives did you.'],
['can','Emily can swim, ___?','can\'t she','can wiederholen und verneinen; Emily → she.'],
['can','Jack can’t come, ___?','can he','can’t → can; Jack → he.'],
['can','We can help, ___?','can\'t we','can → can’t; we bleibt we.'],
['future','They are going to visit London, ___?','aren\'t they','Bei going to ist are das Hilfsverb: aren’t they.'],
['future','She isn’t going to watch the film, ___?','is she','isn’t → is; going to wird im tag nicht wiederholt.'],
['future','You aren’t going to stay here, ___?','are you','aren’t → are; Person you.'],
['future','Jack is going to ride his horse, ___?','isn\'t he','is → isn’t; Jack → he.'],
['progressive','You’re feeling nervous, ___?','aren\'t you','You’re = you are; are → aren’t.'],
['progressive','Her parents are watching the race, ___?','aren\'t they','are → aren’t; her parents → they.'],
['have','Emily has a horse, ___?','doesn\'t she','has als Vollverb im Simple Present → doesn’t.'],
['have','Emily has got a horse, ___?','hasn\'t she','Bei has got wird has für den tag verwendet.'],
['have','You have a dog, ___?','don\'t you','have ohne got als Vollverb → don’t you.'],
['have','You have got a dog, ___?','haven\'t you','Bei have got → haven’t you.'],
['present','The dog likes the farm, ___?','doesn\'t it','Ein Hund → it; Vollverb im Simple Present → doesn’t.'],
['past','The film wasn’t boring, ___?','was it','wasn’t → was; the film → it.']
];tags.forEach(x=>add('tags',...x));
function tagChoices(q){let a=q.answer.split('|')[0],parts=a.split(' '),aux=parts[0],pron=parts[1];let opposite=aux.includes("n't")?aux.replace("n't",''):(aux+"n't");let other=pron==='they'?'it':'they';let wrongAux=aux.startsWith('do')?"isn't":"doesn't";return [...new Set([a,opposite+' '+pron,aux+' '+other,wrongAux+' '+pron])]}
const RULES={future:[['Pläne und erkennbare Anzeichen','Ein Plan: I am going to visit my friend tomorrow. Sichtbare Anzeichen: Look at the clouds. It is going to rain.'],['Die Bausteine','Person + am/is/are + going to + Grundform. I → am · he/she/it → is · you/we/they → are. She is going to play. Kein -s an play.'],['Verneinung','not kommt nach am/is/are: She is not going to swim. = She isn’t going to swim.'],['Fragen','Are you going to come? / Where is she going to stay? Nach dem Fragewort: be + Person + going to + Grundform.'],['Kurzantworten','Is she going to come? Yes, she is. / No, she isn’t. Are you going to come? Yes, I am. Positive Kurzantworten nicht zu Yes, she’s verkürzen.']],tags:[['Das Vorzeichen wechseln','Positiver Satz → negativer tag. She is happy, isn’t she? Negativer Satz → positiver tag. She isn’t happy, is she?'],['Das Hilfsverb finden','be und can aus dem Hauptsatz verwenden: She was tired, wasn’t she? She can swim, can’t she? Bei going to: They are going to come, aren’t they?'],['Wenn kein Hilfsverb da ist','Simple Present: do/does. She likes horses, doesn’t she? Simple Past: did. He played football, didn’t he?'],['Die Person ersetzen','Emily → she · Jack → he · the dog / the hat → it · Emily and Jack → they. Die Person im tag muss zum Subjekt passen.'],['have oder have got?','She has a dog, doesn’t she? / She has got a dog, hasn’t she? Bei have got verwendest du have/has.']]};
let state;try{state=JSON.parse(localStorage.getItem('grammarworkshop-v1'))||{profiles:[],active:null}}catch{state={profiles:[],active:null}}
let session=null, selected=[], tokens=[], hint=false, answered=false, ruleIndex=0, ruleTopic='future';
function save(){try{localStorage.setItem('grammarworkshop-v1',JSON.stringify(state))}catch{$('#storageNote')?.remove();$('#app').insertAdjacentHTML('beforeend','<p id="storageNote">Der Browser kann den Lernstand gerade nicht speichern. Diese Runde funktioniert trotzdem.</p>')}}
function person(){return state.profiles.find(p=>p.id===state.active)}
function profile(){session=null;$('#app').innerHTML='<section class="card"><div class="topic">Dein Lernplatz</div><h1>Wie möchtest du heißen?</h1><p>Ein Vorname oder Spitzname reicht. Jeder hat seinen eigenen Lernstand.</p><form id="newprofile"><label for="nickname">Dein Name</label><input id="nickname" maxlength="30" autocomplete="off" required><p><button>Profil anlegen</button></p></form><div id="profiles" class="row"></div><p class="small muted">Der Lernstand bleibt auf diesem Gerät und in diesem Browser. Auf einem anderen Gerät beginnst du neu.</p></section>';state.profiles.forEach(p=>{let b=document.createElement('button');b.className='secondary';b.textContent=p.name;b.onclick=()=>{state.active=p.id;save();home()};$('#profiles').append(b)});$('#newprofile').onsubmit=e=>{e.preventDefault();let name=$('#nickname').value.trim();if(!name)return;let id=Date.now()+'-'+Math.random().toString(36).slice(2);state.profiles.push({id,name,stats:{},started:false,history:[]});state.active=id;save();home()}}
function stat(q){return person().stats[q.id]||{wins:0,errors:0,last:0}}
function skillStatus(topic){let qs=DB.filter(q=>q.topic===topic),safe=qs.filter(q=>stat(q).wins>=2).length;return `${safe} / ${qs.length} Aufgaben sicher`}
function home(){session=null;let p=person();if(!p)return profile();$('#app').innerHTML=`<div class="topic">Dein Lernplatz</div><h1>Hallo, ${esc(p.name)}.</h1><p class="muted">Eine kurze Runde. Eine Regel nach der anderen.</p><section class="card"><div class="toolbar"><div><h2>${p.started?'Deine nächste Lernrunde':'Was kannst du schon?'}</h2><p>${p.started?'Neue Aufgaben und deine Fehlerstellen, gemischt.':'Acht Aufgaben ohne Hilfen. Danach weißt du, wo du anfangen kannst.'}</p></div><span class="status">${p.started?'10 Aufgaben':'Startcheck'}</span></div>${p.pending?'<button class="secondary" id="resumeSaved">Gespeicherte Runde fortsetzen</button> ':''}<button id="next">${p.started?'Lernrunde starten':'Startcheck starten'}</button></section><div class="grid"><section class="card"><div class="topic">01 / Going-to future</div><h2>Pläne ausdrücken</h2><p>${skillStatus('future')}</p><div class="row"><button data-learn="future">Verstehen</button><button class="secondary" data-ex="future">Üben</button></div></section><section class="card"><div class="topic tag">02 / Question tags</div><h2>Bestätigung erfragen</h2><p>${skillStatus('tags')}</p><div class="row"><button data-learn="tags" style="background:var(--violet)">Verstehen</button><button class="secondary" data-ex="tags">Üben</button></div></section></div><section class="card"><h2>Ohne Hilfe anwenden</h2><p>Gemischte Aufgaben, zwei Kurzproben und deine persönlichen Fehlerstellen.</p><div class="row"><button class="secondary" id="mix">Gemischt üben</button><button class="secondary" id="errors">Fehlerstellen üben</button><button class="secondary" id="testA">Kurzprobe A</button><button class="secondary" id="testB">Kurzprobe B</button></div><p class="small muted">Kurzprobe: 12 Aufgaben, etwa 10–12 Minuten. Kein Zeitdruck. Die Auswertung kommt am Ende.</p></section><details class="card"><summary>Dein Zwei-Tage-Plan und Fortschritt</summary><p>Heute: Startcheck und zwei kurze Lernrunden mit Pause. Morgen: Wiederholen, gemischt üben und eine Kurzprobe. Vor der Schule: fünf Minuten Fehlerstellen.</p><p>„Sicher“ bedeutet: Diese Aufgabe wurde mindestens zweimal ohne Hilfe richtig gelöst. Prüfe dein Verständnis zusätzlich mit neuen Aufgaben in der Kurzprobe.</p>${p.history.slice(-4).reverse().map(h=>`<p>${esc(h.title)}: ${h.score}/${h.total} ohne Hilfe richtig</p>`).join('')||'<p>Noch keine abgeschlossenen Runden.</p>'}</details>`;if($('#resumeSaved'))$('#resumeSaved').onclick=()=>{session=p.pending;if(session.results.length>session.index)session.index++;showQuestion()};$('#next').onclick=()=>p.started?start('adaptive'):start('check');document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>rules(b.dataset.learn,0));document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>start(b.dataset.ex));$('#mix').onclick=()=>start('mix');$('#errors').onclick=()=>start('errors');$('#testA').onclick=()=>start('testA');$('#testB').onclick=()=>start('testB')}
function rules(topic,i){ruleTopic=topic;ruleIndex=i;let rs=RULES[topic];$('#app').innerHTML=`<div class="toolbar"><button class="secondary" id="back">Übersicht</button><span>Regel ${i+1} / ${rs.length}</span></div><section class="card"><div class="topic ${topic==='tags'?'tag':''}">${topic==='tags'?'Question tags':'Going-to future'}</div><h1>${rs[i][0]}</h1><div class="rule ${topic==='tags'?'tags':''}">${rs[i][1]}</div><p>Lies den Beispielsatz und erkläre dir die Regel kurz selbst.</p><div class="row">${i>0?'<button class="secondary" id="prevRule">Zurück</button>':''}<button id="nextRule">${i<rs.length-1?'Nächste Regel':'Mit Hilfe üben'}</button></div></section>`;$('#back').onclick=home;if(i>0)$('#prevRule').onclick=()=>rules(topic,i-1);$('#nextRule').onclick=()=>i<rs.length-1?rules(topic,i+1):start(topic+'Help')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(mode){let test=mode.startsWith('test'), helped=mode.endsWith('Help'),qs,title;
if(test){qs=TESTS[mode==='testA'?0:1];title='Kurzprobe '+(mode==='testA'?'A':'B')}
else if(mode==='check'){qs=[DB[1],DB[4],DB[9],DB[12],DB[30],DB[37],DB[42],DB[48]];title='Startcheck'}
else{let topic=mode.startsWith('future')?'future':mode.startsWith('tags')?'tags':null;qs=DB.filter(q=>!topic||q.topic===topic);if(mode==='errors')qs=qs.filter(q=>stat(q).errors>0&&stat(q).wins<2);if(!qs.length){$('#app').innerHTML='<section class="card"><h1>Keine offenen Fehlerstellen.</h1><p>Teste dich mit neuen Aufgaben in einer Kurzprobe.</p><button id="back">Zur Übersicht</button></section>';$('#back').onclick=home;return}qs=shuffle(qs);if(mode==='adaptive'||mode==='errors'||topic)qs.sort((a,b)=>{let sa=stat(a),sb=stat(b);return (sa.wins>=2)-(sb.wins>=2)||sb.errors-sa.errors||sa.last-sb.last});qs=qs.slice(0,10);title=mode==='errors'?'Fehlerstellen':topic?(topic==='future'?'Going-to future':'Question tags'): 'Gemischte Lernrunde'}
session={mode,test,helped,title,qs,index:0,results:[],retry:[],started:Date.now()};showQuestion()}
function norm(s){return s.trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/\b(isn't)\b/g,'is not').replace(/\baren't\b/g,'are not').replace(/\bwasn't\b/g,'was not').replace(/\bweren't\b/g,'were not').replace(/\bdon't\b/g,'do not').replace(/\bdoesn't\b/g,'does not').replace(/\bdidn't\b/g,'did not').replace(/\bcan't\b/g,'cannot').replace(/\bcannot\b/g,'can not').replace(/\bhasn't\b/g,'has not').replace(/\bhaven't\b/g,'have not').replace(/\b(i|you|we|they)'(m|re)\b/g,(_,p,v)=>p+' '+(v==='m'?'am':'are')).replace(/\b(he|she|it)'s\b/g,'$1 is').replace(/[.,?!]/g,'').replace(/\s+/g,' ')}
function correct(q,s){return q.answer.split('|').some(a=>norm(a)===norm(s))}
function spellingOnly(q,value){let protectedWords=new Set(['am','is','are','was','were','do','does','did','not','can','have','has','had','going','to','i','you','he','she','it','we','they']);let given=norm(value).split(' ');return q.answer.split('|').some(candidate=>{let expected=norm(candidate).split(' ');if(expected.length!==given.length)return false;let diffs=expected.map((w,i)=>[w,given[i]]).filter(([a,b])=>a!==b);if(diffs.length!==1)return false;let [a,b]=diffs[0];if(b===a+'s'||b===a+'es'||a===b+'s'||a===b+'es')return false;if(a.length<4||protectedWords.has(a)||protectedWords.has(b)||Math.abs(a.length-b.length)>1)return false;let dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)dp[i][0]=i;for(let j=0;j<=b.length;j++)dp[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]!==b[j-1]));return dp[a.length][b.length]===1})}

function showQuestion(){let s=session;if(s.index>=s.qs.length)return finish();person().pending=s;save();let q=s.qs[s.index];answered=false;hint=false;selected=[];let guided=s.helped&&!q.options&&!q.prompt.includes('___')&&q.topic==='future';let useChoice=q.options||s.helped&&q.topic==='tags';let choices=q.options||tagChoices(q);choices=[...new Set(choices)];$('#app').innerHTML=`<div class="toolbar"><button class="secondary" id="pause">Pause / Übersicht</button><span>${esc(s.title)} · ${s.index+1} / ${s.qs.length}</span></div><progress value="${s.index}" max="${s.qs.length}" aria-label="Fortschritt"></progress><section class="card"><div class="topic ${q.topic==='tags'?'tag':''}">${q.topic==='tags'?'Question tags':'Going-to future'}${s.helped?' · mit Hilfe':''}</div><h2>${q.topic==='tags'?'Ergänze den question tag.':q.prompt.includes('___')?'Ergänze die Lücke.':'Deine Aufgabe'}</h2><p class="sentence">${esc(q.prompt)}</p>${useChoice?'<div id="choices"></div>':guided?'<p>Tippe die Wörter in der richtigen Reihenfolge an. Zum Entfernen tippe oben auf das Wort.</p><div class="answerzone" id="assembled"></div><div class="tokens" id="tokens"></div><button id="check">Prüfen</button>':`<form id="answerform"><label for="answer">${q.prompt.includes('___')?'Nur die fehlenden Wörter:':'Dein vollständiger Satz:'}</label><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false"><p><button id="check">${s.test?'Antwort abgeben':'Prüfen'}</button></p></form>`}${!s.test&&s.mode!=='check'?'<button class="secondary" id="hint">Tipp anzeigen</button>':''}<div id="feedback" aria-live="polite"></div></section>`;
$('#pause').onclick=()=>{save();session.paused=true;$('#app').innerHTML='<section class="card"><h1>Kurze Pause.</h1><p>Die aktuelle Runde bleibt geöffnet. Dein bisheriger Lernstand ist gespeichert.</p><div class="row"><button id="resume">Runde fortsetzen</button><button class="secondary" id="leave">Runde beenden</button></div></section>';$('#resume').onclick=showQuestion;$('#leave').onclick=()=>{delete person().pending;save();home()}};if(useChoice){shuffle(choices).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>submit(c);$('#choices').append(b)})}else if(guided){tokens=shuffle(q.answer.split('|')[0].replace(/[.?]/g,'').split(' ')).map((word,id)=>({word,id}));renderTokens();$('#check').onclick=()=>submit(selected.map(t=>t.word).join(' '))}else $('#answerform').onsubmit=e=>{e.preventDefault();submit($('#answer').value)};if($('#hint'))$('#hint').onclick=()=>{hint=true;$('#hint').disabled=true;$('#feedback').innerHTML=`<div class="rule">${esc(q.why)}</div>`}}
function renderTokens(){$('#tokens').innerHTML='';$('#assembled').innerHTML='';tokens.forEach(t=>{if(selected.some(x=>x.id===t.id))return;let b=document.createElement('button');b.textContent=t.word;b.onclick=()=>{selected.push(t);renderTokens()};$('#tokens').append(b)});selected.forEach(t=>{let b=document.createElement('button');b.textContent=t.word;b.onclick=()=>{selected=selected.filter(x=>x.id!==t.id);renderTokens()};$('#assembled').append(b)})}
function submit(value){if(answered||!value.trim())return;answered=true;let s=session,q=s.qs[s.index],ok=correct(q,value),independent=ok&&!hint&&!s.helped;s.results.push({q,value,ok,independent});if(!s.test&&q.id!==undefined){let st=stat(q);if(independent)st.wins++;else if(!ok){st.errors++;st.wins=0;if(s.mode!=='check'&&!s.retry.includes(q.id)&&s.qs.length<14){s.retry.push(q.id);s.qs.push(q)}}st.last=Date.now();person().stats[q.id]=st;save()}
if(s.test){s.index++;showQuestion();return}document.querySelectorAll('#app input,#app .choice,#app #check,#app #hint,#app .tokens button,#app .answerzone button').forEach(e=>e.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${ok?'':'error'}"><strong>${ok?'Richtig'+(hint||s.helped?' – mit Unterstützung.':'.'):'Noch einmal genau hinsehen.'}</strong>${!ok?`<p>${spellingOnly(q,value)?'Die Grammatik passt; prüfe die Schreibweise.':'Prüfe die Grammatik anhand der Regel.'}</p><p>Deine Antwort: ${esc(value)}</p><p>Richtig: <b>${esc(q.answer.split('|')[0])}</b></p>`:''}<p>${esc(q.why)}</p>${!ok?'<p class="small">Übe diese Stelle in der Wiederholung noch einmal.</p>':''}</div><button id="continue">Weiter</button>`;$('#continue').onclick=()=>{s.index++;showQuestion()}}
function finish(){let s=session,p=person(),score=s.results.filter(r=>r.independent).length;delete p.pending;if(s.mode==='check')p.started=true;p.history.push({title:s.title,score,total:s.results.length,date:Date.now()});save();let errors=s.results.filter(r=>!r.ok);$('#app').innerHTML=`<section class="card"><div class="topic">${esc(s.title)} abgeschlossen</div><h1>${score} / ${s.results.length} ohne Hilfe richtig</h1><p>${s.helped?'Du hast mit Unterstützung geübt. Probiere jetzt eine Runde ohne Hilfe.':errors.length?'Diese Stellen lohnen sich für deine nächste Runde.':'Gut gelöst. Probiere als Nächstes neue Sätze oder eine Kurzprobe.'}</p><div class="row"><button id="home">Zur Übersicht</button><button class="secondary" id="target">${errors.length?'Diese Fehler üben':'Gemischt üben'}</button></div></section><section class="card"><h2>Deine Auswertung</h2>${s.results.map(r=>`<div class="result"><strong>${r.ok?'Richtig':'Noch üben'}</strong> · ${esc(r.q.prompt)}<p>Deine Antwort: ${esc(r.value)}</p>${!r.ok?`<p>Richtig: <b>${esc(r.q.answer.split('|')[0])}</b></p>`:''}<p class="small muted">${esc(r.q.why)}</p></div>`).join('')}</section>`;$('#home').onclick=home;$('#target').onclick=()=>{if(!errors.length)return start('mix');session={mode:'target',test:false,helped:false,title:'Gezielte Wiederholung',qs:errors.map(r=>r.q),index:0,results:[],retry:[],started:Date.now()};showQuestion()}}
const TESTS=[[],[]];
function test(t,topic,prompt,answer,why){TESTS[t].push({topic,prompt,answer,why})}
test(0,'future','My sister ___ going to visit the museum.','is','My sister → she → is.');test(0,'future','We ___ going to watch TV. (Verneinung)','are not|aren\'t','We → are; not nach are.');test(0,'future','Where ___ your parents going to stay?','are','your parents → they → are.');test(0,'future','Is Mike going to help? — Yes, ___.','he is','Mike → he; Yes, he is.');test(0,'future','Bilde eine Frage: they / visit the museum / tomorrow','Are they going to visit the museum tomorrow?','Are + they + going to + Grundform.');test(0,'future','Verbessere: She is going to watches TV.','She is going to watch TV.','Grundform watch ohne -es.');test(0,'tags','Your brother is at home, ___?','isn\'t he','is → isn’t; brother → he.');test(0,'tags','The children don’t like rain, ___?','do they','don’t → do; children → they.');test(0,'tags','Mike played tennis yesterday, ___?','didn\'t he','Simple Past: didn’t; Mike → he.');test(0,'tags','We can’t visit today, ___?','can we','can’t → can.');test(0,'tags','Sarah is going to help us, ___?','isn\'t she','going to hat hier is: isn’t she.');test(0,'tags','Mike has got a bike, ___?','hasn\'t he','has got → hasn’t; Mike → he.');
test(1,'future','The children ___ going to play outside.','are','children → they → are.');test(1,'future','He ___ going to stay here. (Verneinung)','is not|isn\'t','He → is not / isn’t.');test(1,'future','How long ___ going to visit? (sie = she)','is she','How long + is + she + going to …?');test(1,'future','Are the girls going to come? — No, ___.','they aren\'t|they are not','girls → they; No, they aren’t.');test(1,'future','Bilde eine Aussage: he / meet his friends / tonight','He is going to meet his friends tonight.|He\'s going to meet his friends tonight.','He + is + going to + meet.');test(1,'future','Verbessere: Where she is going to go?','Where is she going to go?','Fragewort + is + she + going to + go?');test(1,'tags','Sarah wasn’t at school, ___?','was she','wasn’t → was; Sarah → she.');test(1,'tags','Your friends like music, ___?','don\'t they','Simple Present Vollverb: don’t they.');test(1,'tags','The ball didn’t fall into the water, ___?','did it','didn’t → did; ball → it.');test(1,'tags','Mike can ride a horse, ___?','can\'t he','can → can’t; Mike → he.');test(1,'tags','The boys aren’t going to play, ___?','are they','aren’t → are; boys → they.');test(1,'tags','Sarah has a bike, ___?','doesn\'t she','has als Vollverb ohne got: doesn’t she.');
$('#profile').onclick=profile;$('#share').onclick=async()=>{let url=new URL(location.href);url.search='';url.hash='';try{if(navigator.share)await navigator.share({title:'Englisch Grammatikwerkstatt',url:url.href});else {await navigator.clipboard.writeText(url.href);$('#share').textContent='Link kopiert'}}catch(e){if(e.name!=='AbortError'){let area=document.createElement('input');area.value=url.href;area.readOnly=true;$('#app').prepend(area);area.select()}}};home();
