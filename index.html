<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25383c"><title>Unsere Lernwerkstatt · Englisch & Latein</title><link rel="stylesheet" href="shared.css"><style>
*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:#25383c;font-family:system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.6}main{max-width:1040px;padding:30px 24px 60px;margin:auto}h1,h2,h3{font-family:Georgia,serif;line-height:1.25;margin:.2em 0 .65em}h1{font-size:clamp(30px,4vw,43px)}h2{font-size:26px}h3{font-size:23px}button,input{font:inherit}button{cursor:pointer;min-height:46px;padding:11px 18px;border:1px solid #d3ded8;border-radius:11px;background:white;color:#25383c;font-weight:650}button.primary{background:#25383c;color:white;border-color:#25383c}input{width:100%;padding:13px;border:2px solid #8b9f9a;border-radius:10px;background:white;font-size:18px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ba7b0b;outline-offset:3px}a{color:inherit} .muted{color:#53676a}.small{font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.eyebrow{font-size:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:750;color:#53676a}.intro{margin:32px 0 25px}.continue{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:#fbfaf6;border:1px solid #d9e1dd;border-radius:18px;padding:25px;margin:22px 0}.continue p{margin:0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 20px}.filters a{text-decoration:none;display:block;padding:10px 20px;border:1px solid #d3ded8;border-radius:12px;background:white;font-weight:650}.filters a.selected{background:#25383c;color:white;border-color:#25383c}.subjects{display:grid;grid-template-columns:1fr 1fr;gap:22px}.subject{border:1px solid #d9e1dd;border-radius:18px;background:#fbfaf6;padding:25px;border-top:5px solid var(--subject)}.subject-heading{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.subject-heading h2{margin:0;color:var(--subject)}.chapter{display:block;text-decoration:none;padding:19px 0;border-top:1px solid #d9e1dd}.chapter:first-of-type{border-top:0}.chapter:hover h3{text-decoration:underline;text-underline-offset:5px}.chapter p{margin:8px 0}.chapter .open{display:inline-block;padding:8px 15px;background:var(--subject);color:white;border-radius:10px;font-size:15px;font-weight:650;margin-top:5px}.status{font-size:14px;color:#53676a}.profilecard{max-width:620px;border:1px solid #d9e1dd;border-radius:18px;padding:28px;background:#fbfaf6;margin-top:30px}.hint{margin-top:24px;padding:20px 0;border-top:1px solid #d3ded8;font-size:15px;color:#53676a}.pill{font-size:14px;padding:4px 10px;background:#edf1ee;border-radius:30px;color:#53676a}.subjects.single{grid-template-columns:1fr}.subjects.single .subject{max-width:760px}.recentlink{text-decoration:none;background:#25383c;color:white;padding:12px 18px;border-radius:11px;font-weight:650;white-space:nowrap}.plan{background:#fbfaf6;border:1px solid #d9e1dd;border-radius:16px;padding:22px;margin-top:25px}.plan summary{cursor:pointer;font-weight:650}@media(max-width:650px){main{padding:20px 15px 45px}.subjects{grid-template-columns:1fr}.continue{grid-template-columns:1fr;padding:22px}.recentlink{justify-self:start}.subject{padding:23px}.filters a{padding:9px 15px}}
</style><script src="shared.js"></script></head><body><main><header class="wl-header"><a class="wl-logo" href="./">Lernwerkstatt</a><div class="wl-tools"><span class="wl-profile" id="wl-name"></span><button id="profile">Profil wechseln</button><button id="share">Teilen</button></div></header><div id="app"></div><footer class="wl-footer">Ein Profil für alle Fächer. Lernstände bleiben auf diesem Gerät und in diesem Browser.<br>Beim Teilen beginnt jede Person mit ihrem eigenen Namen. Auf einem anderen Gerät wird der Fortschritt nicht automatisch übertragen.</footer></main><script>
'use strict';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chooser(){let profiles=Workshop.profiles();$('#app').innerHTML=`<section class="profilecard"><div class="eyebrow">Dein Lernplatz</div><h1>${profiles.length?'Wer lernt heute?':'Wie möchtest du heißen?'}</h1><p>Ein Vorname oder Spitzname reicht. Das Profil gilt für Englisch und Latein.</p><div id="names" class="row"></div><form id="new"><p><label for="name">Neues Profil</label><input id="name" maxlength="30" required autocomplete="off"></p><button class="primary">Profil anlegen</button></form><p class="small muted">Deine bisherigen Profile und Lernstände werden auf diesem Browser übernommen.</p></section>`;profiles.forEach(p=>{let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>{Workshop.select(p.id);location.hash='';home()};$('#names').append(b)});$('#new').onsubmit=e=>{e.preventDefault();let name=$('#name').value.trim();if(!name)return;Workshop.create(name);location.hash='';home()};Workshop.updateName()}
function home(){if(location.hash==='#profile'||!Workshop.active())return chooser();let name=Workshop.active().name,filter=location.hash.slice(1),subject=['latein','englisch'].includes(filter)?filter:null,last=Workshop.last();$('#app').innerHTML=`<div class="intro"><div class="eyebrow">Dein Lernplatz</div><h1>Hallo, ${esc(name)}.</h1><p class="muted">Wähle dein Fach und deinen Lernbereich.</p></div>${last?`<section class="continue"><div><div class="eyebrow">Zuletzt geöffnet · ${last.subject==='latein'?'Latein':'Englisch'}</div><h2>${last.title}</h2><p class="muted">${esc(Workshop.summary(last))}</p></div><a class="recentlink" href="${last.path}">Weiterlernen</a></section>`:''}<nav class="filters" aria-label="Fächer"><a href="#" class="${!subject?'selected':''}">Alle Fächer</a><a href="#latein" class="${subject==='latein'?'selected':''}">Latein</a><a href="#englisch" class="${subject==='englisch'?'selected':''}">Englisch</a></nav><div class="subjects ${subject?'single':''}">${['latein','englisch'].filter(x=>!subject||x===subject).map(s=>{let chapters=Workshop.catalog.filter(c=>c.subject===s);return `<section class="subject" style="--subject:${s==='latein'?'#735526':'#13686c'}"><div class="subject-heading"><h2>${s==='latein'?'Latein':'Englisch'}</h2><span class="pill">${chapters.length} ${s==='latein'?'Bereiche':'Kapitel'}</span></div>${chapters.map(c=>`<a class="chapter" href="${c.path}"><h3>${c.title}</h3><p class="muted">${c.topics}</p><p class="status">${esc(Workshop.summary(c))}</p><span class="open">${s==='latein'?'Bereich öffnen':'Kapitel öffnen'}</span></a>`).join('')}</section>`}).join('')}</div><details class="plan"><summary>So lernst du in der Werkstatt</summary><p><b>Lernen:</b> Regeln und Merkhilfen kennenlernen.</p><p><b>Üben:</b> Wörter und Formen selbst abrufen.</p><p><b>Wiederholen:</b> Fehlerstellen gezielt festigen.</p><p><b>Kurzproben:</b> Ohne Hilfe prüfen und anschließend auswerten.</p></details>`;Workshop.updateName()}
$('#profile').onclick=()=>{location.hash='profile';chooser()};$('#share').onclick=()=>Workshop.share($('#share'));window.addEventListener('hashchange',home);window.addEventListener('focus',()=>{if(location.hash!=='#profile')home()});home();
</script></body></html>
